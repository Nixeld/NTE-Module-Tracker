<!DOCTYPE html>
<html lang="en">
<head>
    <title>NTE Module Tracker</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A free web app to track modules for characters in Neverness to Everness (NTE). Helps players figure out which modules to select when rewinding. Track multiple characters, see total module requirements at a glance, and farm modules efficiently. Data is saved in your browser.">
    <meta name="google-site-verification" content="2RiWVxWcjF00fG7QOKnSJGFcg63C_HF6HxyLhSAsI-c" />
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #e0e0e0;
            font-size: 2.5rem;
        }
        
        h2 {
            color: #e0e0e0;
            margin: 20px 0 10px;
            font-size: 1.5rem;
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
        }
        
        .module-summary {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        
        .module-summary h3 {
            color: #4fc3f7;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }
        
        .summary-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            transition: transform 0.2s, background 0.2s;
        }
        
        .summary-item:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.1);
        }
        
        .summary-item img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 8px;
        }
        
        .summary-item span {
            font-size: 0.9rem;
            color: #aaa;
        }
        
        .summary-item .count {
            font-size: 1.2rem;
            font-weight: bold;
            color: #4fc3f7;
        }
        
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .controls button {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        
        .controls button:active {
            transform: translateY(0);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .btn-danger:hover {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .btn-secondary:hover {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .btn-success:hover {
            background: linear-gradient(135deg, #38f9d7 0%, #43e97b 100%);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        th:nth-child(1),
        td:nth-child(1) {
            min-width: 150px;
        }
        th:nth-child(2),
        td:nth-child(2) {
            min-width: 520px;
        }
        th:nth-child(3),
        td:nth-child(3) {
            min-width: 150px;
        }

        #trackingSection {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        th, td {
            border: 1px solid #333;
            padding: 12px;
            text-align: center;
        }
        
        th {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        
        tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.03);
        }
        
        tr:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        
        input[type="text"] {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #333;
            background-color: #1a1a2e;
            color: #fff;
            border-radius: 6px;
            transition: border-color 0.3s;
            font-size: 14px;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        select {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #333;
            border-radius: 6px;
            background-color: #1a1a2e;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button.delete-btn {
            background: linear-gradient(135deg, #fa4646 0%, #ff6b6b 100%);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        button.delete-btn:hover {
            background: linear-gradient(135deg, #ff6b6b 0%, #fa4646 100%);
            transform: scale(1.05);
        }
        
        .character-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }
        
        .character-cell img {
            width: 192px;
            height: 192px;
            object-fit: contain;
            border-radius: 8px;
        }
        
        .character-cell span {
            font-size: 14px;
            color: #e0e0e0;
            font-weight: 500;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #4fc3f7;
        }
        
        .delete-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .delete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        
        .delete-btn:active {
            transform: translateY(0);
        }
        
        /* Custom Confirmation Dialog */
        .confirm-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        
        .confirm-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .confirm-dialog {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transform: scale(0.8);
            transition: transform 0.3s ease;
            text-align: center;
        }
        
        .confirm-overlay.active .confirm-dialog {
            transform: scale(1);
        }
        
        .confirm-dialog .confirm-icon {
            font-size: 3rem;
            color: #f5576c;
            margin-bottom: 15px;
        }
        
        .confirm-dialog .confirm-title {
            font-size: 1.5rem;
            color: #e0e0e0;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .confirm-dialog .confirm-message {
            color: #aaa;
            margin-bottom: 25px;
            font-size: 1rem;
            line-height: 1.5;
        }
        
        .confirm-dialog .confirm-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        
        .confirm-dialog .confirm-buttons button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .confirm-dialog .confirm-buttons .btn-confirm {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .confirm-dialog .confirm-buttons .btn-confirm:hover {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        
        .confirm-dialog .confirm-buttons .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
        }
        
        .confirm-dialog .confirm-buttons .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        /* Undo Toast */
        .undo-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 12px;
            padding: 16px 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 3000;
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .undo-toast.active {
            transform: translateX(-50%) translateY(0);
        }
        
        .undo-toast .toast-message {
            color: #e0e0e0;
            font-size: 14px;
            font-weight: 500;
        }
        
        .undo-toast .undo-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .undo-toast .undo-btn:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            transform: scale(1.05);
        }
        
        .undo-toast .toast-close {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }
        
        .undo-toast .toast-close:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        td, .modules-container {
            gap: 10px;
        }

        
        @media (max-width: 768px) {
            body {
                padding: 5px;
            }
            
            .summary-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }

            td, .modules-container {
                gap: 5px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .controls button {
                width: 100%;
            }

            th, td {
            padding: 6px;
            }

            th:nth-child(1),
            td:nth-child(1) {
                min-width: 0px;
                padding: 0px;
            }

            th:nth-child(2),
            td:nth-child(2) {
                min-width: 0px;
            }

            th:nth-child(3),
            td:nth-child(3) {
                min-width:0px;
            }

            .character-cell img {
                width: 80px;
                height: 80px;
            }

            .character-cell span {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>NTE Module Tracker</h1>
        
        <!-- Module Summary Section -->
        <div class="module-summary" id="moduleSummary">
            <h3><i class="fas fa-list-ul"></i> Total Module Requirements</h3>
            <div class="summary-grid" id="summaryGrid">
                <div class="empty-state">
                    <i class="fas fa-box-open"></i>
                    <p>No modules tracked yet</p>
                </div>
            </div>
        </div>
        
        <!-- Module Tracking Section -->
        <div id="trackingSection">
            <div class="controls">
                <button class="btn-success" id="addCharacterBtn"><i class="fas fa-plus"></i> Add Character</button>
                <button class="btn-danger" id="removeAllBtn"><i class="fas fa-trash"></i> Clear All</button>
                <button class="btn-secondary" onclick="exportData()"><i class="fas fa-download"></i> Export Data</button>
                <button class="btn-secondary" onclick="importData()"><i class="fas fa-upload"></i> Import Data</button>
            </div>
            
            <table id="characterTable">
                <thead>
                    <tr>
                        <th>Character</th>
                        <th>Modules</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    
    <script src="modules.js"></script>
</body>
</html>
